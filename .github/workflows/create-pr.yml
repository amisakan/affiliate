name: Create pull request

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: "Branch containing the proposed changes"
        required: true
        type: string
      base_branch:
        description: "Target branch for the pull request"
        required: true
        default: "main"
        type: string
      title:
        description: "Pull request title"
        required: true
        type: string
      body:
        description: "Pull request body"
        required: true
        type: string
      draft:
        description: "Create as draft pull request"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create pull request
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse pull request
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headBranch = core.getInput("head_branch", { required: true }).trim();
            const baseBranch = core.getInput("base_branch", { required: true }).trim();
            const title = core.getInput("title", { required: true });
            const body = core.getInput("body", { required: true });
            const draft = core.getBooleanInput("draft", { required: true });

            const { data: existingPulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${headBranch}`,
              base: baseBranch,
              per_page: 1,
            });

            if (existingPulls.length > 0) {
              const pull = existingPulls[0];
              core.notice(`Pull request already exists: ${pull.html_url}`);
              await core.summary
                .addHeading("Pull request already exists")
                .addLink(`#${pull.number}: ${pull.title}`, pull.html_url)
                .write();
              return;
            }

            const { data: pull } = await github.rest.pulls.create({
              owner,
              repo,
              head: headBranch,
              base: baseBranch,
              title,
              body,
              draft,
            });

            core.notice(`Created pull request: ${pull.html_url}`);
            await core.summary
              .addHeading("Created pull request")
              .addLink(`#${pull.number}: ${pull.title}`, pull.html_url)
              .write();
